<style>
:root{color-scheme:dark;--bg:#0a0a18;--p:#161633;--p2:#20204a;--tx:#e8e8ff;--mu:#8a8ab8;--cy:#2de2d0;--pu:#a35cff;--go:#ffc94d;--rd:#ff4d6a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at top,#1d1448,#0a0a18 62%) fixed;background-color:#0a0a18;color:var(--tx);font:15px/1.45 "Noto Sans KR",system-ui,-apple-system,sans-serif;user-select:none}
#app{max-width:520px;margin:0 auto;padding:12px}

h3{margin:10px 0}
.sub{text-align:center;color:var(--mu);margin:6px 0 12px}

.btn{display:block;width:100%;padding:13px;margin:8px 0;border:1px solid #3a3a7a;border-radius:12px;background:var(--p2);color:var(--tx);font:inherit;font-weight:600}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(90deg,#17776f,#5a2bb0);border-color:var(--cy)}
.btn:disabled,.card:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.cards{display:flex;gap:8px;margin:10px 0}
.card{flex:1;min-width:0;border:2px solid var(--c);border-radius:12px;padding:10px 8px;background:var(--p);color:var(--tx);font:inherit;text-align:left;box-shadow:0 0 14px -5px var(--c)}
.card b{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--c);color:var(--c);border-radius:99px;padding:2px 9px;font-size:12px}
.bar{height:10px;border-radius:6px;background:#000;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;transition:width .12s}
canvas{width:100%;display:block;border-radius:12px;border:1px solid #3a3a7a;margin:8px 0;touch-action:none}
.pads{display:flex;gap:6px;margin-top:6px}
.pad{flex:1;height:78px;border:2px solid var(--c);border-radius:14px;background:#14143a;color:var(--c);font:inherit;touch-action:none;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.pad b{font-size:20px}.pad small{color:inherit;font-size:10px}
.pad.on{background:var(--c);color:#000}
.sk{height:52px;--c:#7a7ab0;opacity:.45;gap:0}.sk b{font-size:14px}.sk small{font-size:9px}.sk.rdy{opacity:1;--c:#ffc94d;box-shadow:0 0 12px -2px var(--c)}
.how{background:var(--p);border-radius:12px;padding:12px;margin-top:14px;color:var(--mu);font-size:13px}
.how b{color:var(--tx)}
input{display:block;width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a3a7a;background:#0e0e26;color:var(--tx);font:inherit;user-select:text;-webkit-user-select:text}

function synth(msg){show(`${hdr()}<h3>🔮 카드 합성</h3><p class="sub">${msg||'재료 카드 두 장(Lv.1씩 소모)으로 상위 카드를 만듭니다'}</p>${RCP.map((r,i)=>[r,i]).sort((x,y)=>can(y[0])-can(x[0])).map(([r,i])=>{const[a,b,c]=r.map(x=>CDM[x]);return`<button class="card" style="--c:${RC[c[3]]};width:100%;margin:6px 0" ${can(r)?'':'disabled'} onclick="doSynth(${i})"><small>${a[1]} (${R.cards[r[0]]||0}) + ${b[1]} (${R.cards[r[1]]||0})</small><b>→ ${c[1]} <small style="color:var(--c)">${c[3]}</small></b><small>${c[4]}</small></button>`}).join('')}${chips()}<button class="btn pri" onclick="map()">돌아가기</button>`)}
function doSynth(i){const[a,b,c]=RCP[i];if(!can(RCP[i]))return;for(const x of[a,b])if(--R.cards[x]<=0)delete R.cards[x];give(c);R.hp=Math.min(R.hp,MH());synth('🔮 '+CDM[c][1]+' 합성 완료!')}
function adv(){R.opts=null;if(++R.ri>2){R.ri=0;if(R.f%5==0){R.cp={f:R.f+1,cards:{...R.cards},gold:R.gold};R.msg='🚩 체크포인트 활성화!'}R.f++}}
function room(k){if('neb'.includes(k))return fight(k);
if(k=='t'){const id=pick('t'),g=30+5*R.f;give(id);R.gold+=g;adv();R.msg=`🎁 ${CDM[id][1]} 획득! 🪙+${g}`;map()}
else if(k=='r'){R.hp=Math.min(MH(),R.hp+MH()*(.4+M.up[4]*.04));adv();R.msg='🛌 체력을 회복했습니다';map()}else shop()}
const give=id=>{R.cards[id]=(R.cards[id]||0)+1;R.st=stats()};
function shop(){R.sh=R.sh||(()=>{const a=[];while(a.length<3){const i=pick('s');a.includes(i)||a.push(i)}return a})();const pr={C:35,R:70,E:120,L:220};
show(`${hdr()}<h3>🛒 상점</h3><div class="cards">${R.sh.map((id,i)=>{if(!id)return'<div class="card" style="--c:#333"><small>품절</small></div>';const c=CDM[id],p=pr[c[3]];return`<button class="card" style="--c:${RC[c[3]]}" ${R.gold<p?'disabled':''} onclick="buy(${i},${p})">${cardH(c)}<b>🪙${p}</b></button>`}).join('')}</div>${chips()}
<button class="btn" ${R.gold<40?'disabled':''} onclick="buy(-1,40)">❤️ 체력 30% 회복 (🪙40)</button><button class="btn pri" onclick="R.sh=null;adv();map()">나가기</button>`)}
function buy(i,p){if(R.gold<p)return;R.gold-=p;if(i<0)R.hp=Math.min(MH(),R.hp+MH()*.3);else{give(R.sh[i]);R.sh[i]=0}shop()}
function fight(k){const F=R.f,e=k=='e',base=k=='b'?BO[(F/5-1)%3|0]:rnd(MO),m={...base};m.mhp=m.hp=Math.round(base.hp*.85*(1+.18*(F-1))*(e?1.5:1));m.dmg=base.at*.9*(1+.08*(F-1))*(e?1.15:1);m.df=m.bdf=base.df||0;m.ms=MS[base.n];m.fl=FL[base.n];
B={m,k,notes:[],t0:performance.now(),nb:1700,step:15000/(base.bpm*(1+Math.min(F,40)*.006)),si:0,g:G[0],last:[-1e9,-1e9,-1e9,-1e9,-1e9],combo:0,mc:0,en:0,buf:[],fx:[],jt:'',jc:0,jtt:-1e9,fl:-1e9,end:0,rt:0};
show(`<div class="row"><div style="font-size:46px">${m.e}</div><div style="flex:1"><b>${e?'🔥 ':''}${m.n}</b> <small>${m.t}</small><div class="bar"><i id="mh" style="background:var(--rd)"></i></div><small id="md"></small></div></div>
<canvas id="cv" width="480" height="330"></canvas>
<div class="row"><div style="flex:1"><div class="bar"><i id="ph" style="background:var(--cy)"></i></div><small id="pt"></small></div><div style="flex:1"><div class="bar"><i id="pe" style="background:var(--go)"></i></div><small id="et"></small></div></div>
<div class="pads" style="margin:0 0 6px">${[0,1,2,3,4].map(i=>`<button id="sk${i}" class="pad sk" onpointerdown="event.preventDefault();sk(${i})"><b>${i+1}</b><small>${SN[i]}</small><small>⚡${cs(SC[i])}</small></button>`).join('')}</div><div class="pads">${K.map((k,i)=>`<button class="pad" style="--c:${LC[i]}" onpointerdown="event.preventDefault();press(${i});this.classList.add('on')" onpointerup="this.classList.remove('on')" onpointerleave="this.classList.remove('on')" onpointercancel="this.classList.remove('on')"><b>${k}</b><small>${LN[i]}</small></button>`).join('')}</div>`);requestAnimationFrame(loop)}
function gen(b){const m=b.m,s=R.st,F=R.f,si=b.si++,bar=si>>4,p=si&15,pb=bar&3,t=b.nb,ph=b.k=='b'?1+(m.hp<m.mhp*.7)+(m.hp<m.mhp*.35):1,fill=pb==3&&p>=12,add=(l,mo)=>b.notes.push({l,t,m:mo});
if(!p&&!pb){const tr=Math.min(5,((F-1)/4|0)+(b.k=='b'?1:0));b.g=G[Math.max(0,tr-(Math.random()<.5?1:0))]}
if(!fill){for(let l=0;l<3;l++)if(b.g[l][p]=='x')add(l,0);if(!p&&!pb)add(3,0);if(m.bdf&&(p==6||p==14))add(4,0);if(p%2==0&&b.g[2][p]!='x'&&Math.random()<s.den*1.2)add(2,0);
if([...m.ms[pb],...(ph>1?[10]:[]),...(ph>2?[6]:[])].includes(p))add(m.bdf?3:4,1)}
else if(m.fl.includes(p))add(m.fl.indexOf(p)%2?4:1,1)}
function loop(){const b=B;if(!b||b.end)return;const now=NW();while(b.nb<now+TT()+60){gen(b);b.nb+=b.step}
for(const n of b.notes)if(!n.h&&now-n.t>wG()){n.h=1;judge(n,3)}
b.notes=b.notes.filter(n=>!n.h);
if(b.m.ex&&now-b.rt>12000){b.rt=now;b.combo=0;b.jt='COMBO BREAK!';b.jc=3;b.jtt=now}
if(b.end)return;draw(now);const m=b.m;
$('#mh').style.width=Math.max(0,m.hp/m.mhp*100)+'%';$('#md').textContent='🛡 방어 '+Math.round(m.df*100)+'%';$('#ph').style.width=Math.max(0,R.hp/MH()*100)+'%';$('#pt').textContent='❤️ '+Math.max(0,Math.ceil(R.hp))+'/'+MH();$('#pe').style.width=b.en+'%';$('#et').textContent='⚡ 에너지 '+Math.floor(b.en);for(let i=0;i<5;i++)$('#sk'+i).classList.toggle('rdy',b.en>=cs(SC[i]));
requestAnimationFrame(loop)}
function draw(now){const c=$('#cv').getContext('2d'),b=B,T=TT();c.clearRect(0,0,480,330);
for(let i=0;i<5;i++){c.fillStyle=i%2?'#14143a':'#10102e';c.fillRect(i*96,0,96,330);c.fillStyle=LC[i]+'28';c.fillRect(i*96,261,96,28)}
c.fillStyle='#fffa';c.fillRect(0,274,480,2);
for(let k=Math.max(0,Math.ceil((now-T*.25-1700)/(b.step*4)));;k++){const y=274-(1700+k*b.step*4-now)/T*274;if(y<0)break;c.fillStyle=k%4?'#ffffff14':'#ffffff40';c.fillRect(0,y,480,k%4?1:2)}
for(const n of b.notes){const y=274-(n.t-now)/T*274;if(y<-20)continue;c.fillStyle=n.m?'#ff3355':LC[n.l];c.shadowColor=c.fillStyle;c.shadowBlur=10;c.beginPath();c.roundRect?c.roundRect(n.l*96+8,y-11,80,22,8):c.rect(n.l*96+8,y-11,80,22);c.fill();c.shadowBlur=0;if(n.m){c.fillStyle='#fff';c.font='bold 13px sans-serif';c.textAlign='center';c.fillText('🛡 방어',n.l*96+48,y+5)}}
const a=now-b.fl;if(a<250){c.fillStyle=`rgba(255,40,70,${.35*(1-a/250)})`;c.fillRect(0,0,480,330)}
c.textAlign='center';if(b.combo>2){c.fillStyle='#fff9';c.font='bold 22px sans-serif';c.fillText(b.combo+' COMBO',240,60)}
if(now-b.jtt<600){c.fillStyle=['#2de2d0','#4da3ff','#ffc94d','#ff4d6a'][b.jc];c.font='bold 28px sans-serif';c.fillText(b.jt,240,130)}
b.fx=b.fx.filter(f=>now-f.t<800);for(const f of b.fx){c.fillStyle=f.c;c.font='bold 18px sans-serif';c.fillText(f.s,f.x,f.y-(now-f.t)*.06)}}
function atk(l){const s=R.st,b=B;return A0()*LB[l]*(1+s['d'+l]+s.all+(l==1&&b.ll==1?s.rs:0)+Math.min(b.combo,60)*(.008+s.cb)+(R.hp<MH()*.3?s.ls:0))}
function hurt(d,l){const b=B,m=b.m;d*=1-m.df;m.hp-=d;b.fx.push({x:l*96+48,y:250,s:Math.round(d),c:'#fff',t:NW()});if(m.hp<=0&&!b.end){b.end=1;setTimeout(win,700)}}
function dmgP(d){const b=B;d*=Math.max(.25,1-R.st.df-M.up[3]*.02);R.hp-=d;b.fl=NW();if(d>0)b.fx.push({x:240,y:200,s:'-'+Math.round(d),c:'#ff4d6a',t:NW()});if(R.hp<=0&&!b.end){b.end=1;setTimeout(die,500)}}
function judge(n,j){const b=B,s=R.st,x=[1,.75,.5,0][j];b.jt=['PERFECT','GREAT','GOOD','MISS'][j];b.jc=j;b.jtt=NW();
if(j<3){b.combo++;b.mc=Math.max(b.mc,b.combo);b.en=Math.min(100,b.en+[2,1,.5][j]+(j==0?s.pe:0)+(!n.m&&n.l==3?s.ac:0));if(s.ib&&b.combo%20==0)R.hp=Math.min(MH(),R.hp+s.ib);if(j==0&&s.vg)R.hp=Math.min(MH(),R.hp+s.vg)}else b.combo=0;
if(!n.m){if(j<3){hurt(atk(n.l)*x*(j==0?1+s.pd:1),n.l);b.ll=n.l;if(s.sth&&b.combo%10==0)hurt(A0()*2*s.sth,2);if(n.l==4)b.m.df=Math.max(0,b.m.df-.06*(1+s.tm))}}
else dmgP(b.m.dmg*[0,.4,.7,1-s.mp][j])}
function press(l){const b=B;if(!b||b.end)return;snd(l);const now=NW();let best=null;
for(const n of b.notes)if(!n.h&&n.l==l){const d=Math.abs(n.t-now);if(d<=wG()&&(!best||d<Math.abs(best.t-now)))best=n}
if(best){const d=Math.abs(best.t-now);best.h=1;return judge(best,d<=wP()?0:d<=wR()?1:2)}
b.buf.push([l,now]);b.buf=b.buf.filter(x=>now-x[1]<1300);if(R.st.gh)b.en=Math.min(100,b.en+R.st.gh);special(l,now)}
const SC=[20,30,35,40,100],SN=['Double Kick','Snare Rush','Tom Break','Crash Finish','Drum Solo'],cs=c=>Math.round(c*(1-Math.min(.6,R.st.es)));
function sk(i){const b=B;if(!b||b.end||b.en<cs(SC[i]))return;const s=R.st,a=A0()*(1+s.all),sp=1+s.sp;
const F=[()=>hurt(a*3.5*(sp+s.k0),0),()=>hurt(a*5*(sp+s.k1),1),()=>{b.m.df=Math.max(0,b.m.df-.3*(1+s.tm));hurt(a*2*(sp+s.k4),4)},()=>hurt(a*5*(sp+s.k3),3),()=>hurt(a*14*(sp+s.k5),2)];
b.en-=cs(SC[i]);b.buf=[];b.jt=SN[i].toUpperCase()+'!';b.jc=2;b.jtt=NW();F[i]()}
function special(l,now){const b=B,bf=b.buf,n=(k,ms)=>bf.filter(x=>x[0]==k&&now-x[1]<ms).length;
if([0,1,2,3,4].every(k=>n(k,1300))&&b.en>=cs(100))sk(4);else if(l==0&&n(0,380)>=2&&b.en>=cs(20))sk(0);else if(l==1&&n(1,800)>=4&&b.en>=cs(30))sk(1);else if(l==4&&n(4,800)>=3&&b.en>=cs(35))sk(2)}
function win(){const k=B.k,F=R.f,g=Math.round((k=='b'?100+15*F:k=='e'?40+8*F:20+4*F)*(1+R.st.lk));R.gold+=g;R.kills++;R.mc=Math.max(R.mc,B.mc);R.hp=Math.min(MH(),R.hp+MH()*R.st.rc*(1+M.up[4]*.1));
R.rw=[];while(R.rw.length<3){const i=pick(k);R.rw.includes(i)||R.rw.push(i)}
show(`<h3 style="text-align:center">🎉 승리! 🪙+${g}</h3><p class="sub">카드를 하나 선택하세요</p><div class="cards">${R.rw.map(id=>{const c=CDM[id];return`<button class="card" style="--c:${RC[c[3]]}" onclick="take('${id}')">${cardH(c)}</button>`}).join('')}</div>${chips()}`)}
function take(id){give(id);R.hp=Math.min(R.hp,MH());adv();map()}
function die(){B.end=1;const g=R.f*3+R.kills,sc=R.f*100+R.kills*10+R.mc;R.sc=sc;M.sh+=g;M.best=Math.max(M.best,R.f);save();fin();
show(`<h1 style="font-size:26px">RESULT</h1><p class="sub">💀 ${R.f}층에서 쓰러졌습니다</p><p style="text-align:center">처치 ${R.kills} · 최대 콤보 ${R.mc}<br>점수 <b>${sc}</b> · 영혼 조각 ✨+${g}</p>${rn()}${R.cp?`<button class="btn pri" onclick="revive()">🚩 ${R.cp.f}층 체크포인트에서 부활</button>`:''}<button class="btn" onclick="menu()">메인 메뉴 (영구 성장)</button>`);R.kills=0}
function revive(){R.f=R.cp.f;R.ri=0;R.cards={...R.cp.cards};R.gold=Math.floor(R.cp.gold/2);R.st=stats();R.hp=MH()*.5;R.opts=null;R.sh=null;R.msg='🚩 체크포인트에서 부활 (골드 절반 손실)';map()}
onkeydown=e=>{if(e.repeat)return;const l='wsafd'.indexOf(e.key.toLowerCase()),d='12345'.indexOf(e.key);if(B&&!B.end){if(l>=0){e.preventDefault();press(l)}else if(d>=0)sk(d)}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const acct=()=>{const f=window.FB;if(!f)return'';if(!f.ok)return`<p class="sub">⚠️ ${f.err&&f.err!='config'?'Firebase에 연결하지 못했어요 ('+esc(f.err)+')':'Firebase 설정 전이라 로그인·리더보드가 꺼져 있어요'}</p>`;return f.user?`<p class="sub">👤 ${esc(f.user.name)} · <a onclick="FB.out()" style="color:var(--cy);text-decoration:underline">로그아웃</a></p>`:'<button class="btn" onclick="login()">🔑 로그인</button>'};
const rn=()=>{const f=window.FB;return!f||!f.ok?'':f.user?'<p class="sub">🏆 리더보드에 기록을 올렸어요 (최고 기록일 때 반영)</p>':'<button class="btn" onclick="login()">🔑 로그인하고 기록 올리기</button>'};
function fin(){const f=window.FB;if(!R||!f||!f.ok||!f.user)return;const sc=Math.max(R.sc||0,R.f*100+R.kills*10+R.mc);if(R.sub>=sc)return;R.sub=sc;f.submit({score:sc,floor:R.f,kills:R.kills,combo:R.mc}).catch(()=>{})}
const EM={'auth/invalid-credential':'이메일 또는 비밀번호가 맞지 않아요','auth/email-already-in-use':'이미 가입된 이메일이에요','auth/weak-password':'비밀번호는 6자 이상이어야 해요','auth/invalid-email':'이메일 형식을 확인해 주세요','auth/popup-closed-by-user':'로그인 창이 닫혔어요','timeout':'응답이 없어요. 인터넷 연결과 Firebase 설정(로그인 방식 사용 설정, 승인된 도메인)을 확인해 주세요','auth/user-not-found':'가입되지 않은 이메일이에요','auth/wrong-password':'비밀번호가 맞지 않아요','auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해 주세요','auth/operation-not-allowed':'Firebase 콘솔에서 이 로그인 방식을 켜 주세요','auth/unauthorized-domain':'Firebase 승인된 도메인에 이 주소를 추가해 주세요'};
function login(msg,em){show(`<h3>🔑 로그인</h3><p class="sub">${msg||'로그인하면 기록이 리더보드에 올라가요'}</p><button class="btn pri" onclick="lg(0)">Google로 계속하기</button><input id="nm" placeholder="닉네임 (가입할 때만, 12자 이내)" maxlength="12"><input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="이메일 (예: name@example.com)" value="${esc(em||'')}"><input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호 (6자 이상)"><div class="row"><button class="btn" onclick="lg(1)">로그인</button><button class="btn" onclick="lg(2)">가입</button></div><button class="btn" onclick="menu()">뒤로</button><small>${location.protocol=='file:'?'⚠️ 파일을 직접 열면 로그인이 안 될 수 있어요. localhost나 호스팅 주소로 열어 주세요. ':''}주소: ${esc(location.origin)}</small>`)}
async function lg(t){let em='';const T=p=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),20000))]);try{if(t){em=$('#em').value.trim().toLowerCase();const pw=$('#pw').value;if(!/^\S+@\S+\.\S+$/.test(em))return login('이메일 주소로 로그인해야 해요 (예: name@example.com). 닉네임 칸은 가입할 때만 써요.',em);if(pw.length<6)return login('비밀번호는 6자 이상이에요',em);busy();await T(FB.email(em,pw,t==2,$('#nm').value))}else{busy();await T(FB.google())}fin();home()}catch(e){login(EM[e.code]||'로그인에 실패했어요 ('+(e.code||e.message||'오류')+')',em)}}
