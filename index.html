<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRUM MASTER</title>
<style>
:root{--bg:#0a0a1c;--glow:#1d1650;--card:#16163a;--fg:#ecebff;--dim:#8a89b8;--k:#ff3d81;--s:#3df0ff;--h:#ffe83d;--c:#b06cff;--sg:#3df0ff44;--bd:#3df0ff33;--deco:none;--hf:inherit;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;user-select:none;-webkit-user-select:none}
#app{max-width:720px;margin:auto;padding:14px}
.scr{display:none}.scr.on{display:block}
h1{font-size:44px;margin:24px 0 4px;text-align:center;letter-spacing:2px;font-family:var(--hf)}h1 b{color:var(--s);text-shadow:0 0 16px var(--s)}
h2{margin:8px 0;font-family:var(--hf)}h3{margin:16px 0 4px}.sub{text-align:center;color:var(--dim);margin:0 0 18px}.dim{color:var(--dim);font-size:13px;margin:4px 0}
.btn{display:block;width:100%;padding:16px;margin:10px 0;border:1px solid var(--s);border-radius:14px;background:#0003;color:var(--fg);font-size:18px;font-weight:700;box-shadow:0 0 12px var(--sg)}
.btn:active{background:var(--sg)}
.sm{padding:8px 14px;margin:6px 8px 0 0;border:1px solid var(--dim);border-radius:10px;background:none;color:var(--fg);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0;line-height:1.6}
pre{margin:6px 0;font-size:12px;line-height:1.4;color:var(--dim);overflow-x:auto}
#hud{display:flex;gap:6px;text-align:center}#hud div{flex:1;background:var(--card);border-radius:10px;padding:6px 2px;font-size:11px;color:var(--dim)}#hud b{display:block;font-size:19px;color:var(--fg)}
#top{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
#goal{color:var(--s);font-size:14px}
#cv{width:100%;height:230px;display:block;background:#0006;border-radius:14px;margin:6px 0}
#judge{height:36px;text-align:center;font-size:24px;font-weight:900}
#pads{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad{height:130px;border-radius:16px;border:2px solid var(--p);color:var(--p);background:#0004;font-size:16px;font-weight:800;touch-action:none}
.pad small{display:block;opacity:.7;margin-top:4px}
.pad.on{background:var(--p);color:#000;box-shadow:0 0 26px var(--p)}
#pause{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:30px;z-index:5}#pause.on{display:flex}#pause .btn{max-width:280px}
input[type=range]{width:60%;vertical-align:middle}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}.row .nm{flex:1;min-width:90px}input[type=number]{width:84px;padding:6px;border-radius:8px;border:1px solid var(--dim);background:#0004;color:var(--fg)}input{-webkit-user-select:text;user-select:text}.in{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid var(--dim);background:#0004;color:var(--fg);font-size:16px}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--deco)}
.pbg-stage,.pbg-vinyl,.pbg-wave,#sl .card{text-shadow:0 1px 3px #000b}
.pbg-stage{background:radial-gradient(ellipse at 15% 0,#ff3d81aa,#0000 60%),radial-gradient(ellipse at 85% 0,#3df0ffaa,#0000 60%),linear-gradient(#1c1234,#0b0a1a)}
.pbg-vinyl{background:radial-gradient(circle at 92% 50%,#ff3d81 0 18px,#0a0a12 19px 21px,#0000 22px),repeating-radial-gradient(circle at 92% 50%,#1d1d2b 0 2px,#090911 3px 5px)}
.pbg-wave{background:linear-gradient(#0c0a1c 15%,#0c0a1c00),repeating-linear-gradient(90deg,#0c0a1c 0 3px,#0000 3px 8px),linear-gradient(90deg,#ff3d81,#b06cff,#3df0ff)}
#gt{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#000d;text-align:center;padding:30px;overflow:hidden}
#gt.on{display:flex}
#gt::before{content:"";position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(#ffd36e22 0 8deg,#0000 8deg 20deg);animation:gr 14s linear infinite}
#gt>*{position:relative}
#gt small{font-size:15px;color:#ffe9b0;animation:gf .6s .5s both}
#gt h1{font-size:52px;margin:6px 0;background:linear-gradient(90deg,#ffd36e,#fff,#ffd36e) 0 0/200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ffd36e99);animation:gp .9s cubic-bezier(.2,1.6,.4,1) both,gs 2.4s linear .9s infinite}
#gt div{width:100%;max-width:280px;animation:gf .6s 1.1s both}
#gt i{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#ffd36e;box-shadow:0 0 10px #ffd36e;animation:gb 1.1s ease-out both}
@keyframes gr{to{transform:rotate(1turn)}}
@keyframes gp{from{transform:scale(0) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes gs{to{background-position:200% 0}}
@keyframes gf{from{opacity:0;transform:translateY(8px)}}
@keyframes gb{from{transform:rotate(var(--a)) translateX(0);opacity:1}to{transform:rotate(var(--a)) translateX(var(--d));opacity:0}}
@media (prefers-reduced-motion:reduce){#gt::before,#gt h1,#gt small,#gt div{animation:none}#gt i{display:none}}
@media (max-height:620px){#cv{height:170px}.pad{height:90px}}
</style></head><body>
<main id="app">
<section id="menu" class="scr on">
<h1>DRUM <b>MASTER</b></h1><p class="sub">리듬 게임으로 배우는 드럼 악보</p>
<button class="btn" onclick="lessons()">레슨 모드</button>
<button class="btn" onclick="run('I')">무한 연주 모드</button><button class="btn" onclick="show('board')">리더보드</button><button class="btn" onclick="show('shop')">상점 🪙</button><div class="card" id="acct"></div>
<div class="card">🪙 코인 <b id="coin"></b><br>최고 점수 <b id="best"></b> · 최고 콤보 <b id="bc"></b></div>
<div class="card">음량 <input type="range" id="vol" min="0" max="1" step=".05"><br><span class="dim">키보드: A 크래시 · S 하이햇 · D 스네어 · F 킥 / 모바일은 버튼을 터치하세요. 여러 버튼을 동시에 누를 수 있습니다.</span></div>
</section>
<section id="lessons" class="scr"><h2>레슨 모드</h2><div id="llist"></div><button class="btn" onclick="show('menu')">메뉴로</button></section>
<section id="auth" class="scr"><h2>계정</h2><div class="card"><input id="an" class="in" type="text" placeholder="닉네임 (2~12자)" maxlength="12" autocomplete="off"><input id="ap" class="in" type="password" placeholder="비밀번호 (4자 이상)" autocomplete="off"><input id="ae" class="in" type="email" placeholder="관리자 이메일" autocomplete="email" style="display:none"><div id="am" class="dim"></div><button class="btn" onclick="auth(0)">로그인</button><button class="btn" onclick="auth(1)">계정 만들기</button></div><button class="btn" onclick="show('menu')">메뉴로</button></section>
<section id="shop" class="scr"><h2>상점</h2><div class="card">🪙 보유 코인 <b id="sc2"></b><br><span class="dim">코인은 겉모습만 바꿔요. 판정에는 영향이 없어요.</span><div id="shm" class="dim"></div></div><div id="sl"></div><button class="btn" onclick="show('menu')">메뉴로</button></section>
<section id="board" class="scr"><h2>무한 연주 리더보드</h2><div id="bmsg" class="dim"></div><div id="bl"></div><button class="btn" onclick="show('menu')">메뉴로</button></section>
<section id="game" class="scr">
<div id="hud"><div>점수<b id="sc">0</b></div><div>콤보<b id="cb">0</b></div><div>스테이지<b id="st">1</b></div><div>정확도<b id="ac">100%</b></div><div>실수<b id="ms">-</b></div></div>
<div id="top"><span id="goal"></span><button class="sm" onclick="pz(1)">일시정지</button></div>
<canvas id="cv"></canvas><div id="judge"></div>
<div id="pads">
<button class="pad" data-i="C" style="--p:#b06cff">크래시<small>A</small></button>
<button class="pad" data-i="H" style="--p:#ffe83d">하이햇<small>S</small></button>
<button class="pad" data-i="S" style="--p:#3df0ff">스네어<small>D</small></button>
<button class="pad" data-i="K" style="--p:#ff3d81">킥<small>F</small></button>
</div></section>
<section id="result" class="scr"><h1 id="rt" style="font-size:30px"></h1><div id="rb"></div><div id="rbtn"></div></section>
</main>
<div id="pause"><h2>일시정지</h2><button class="btn" onclick="pz(0)">계속하기</button><button class="btn" onclick="restart()">처음부터 다시 시작</button><button class="btn" onclick="quit()">메뉴로 나가기</button></div>
<div id="gt"><small>모든 레슨 정확도 100% 달성!</small><h1>리듬의 신</h1><small>새 칭호를 얻었어요</small><div><button class="btn" onclick="gtEq()">칭호 장착하기</button><button class="btn" onclick="gtX()">닫기</button></div></div>
<script>
const $=i=>document.getElementById(i),INST=['C','H','S','K'],COL={K:'#ff3d81',S:'#3df0ff',H:'#ffe83d',C:'#b06cff'},KEY={a:'C',s:'H',d:'S',f:'K'};
let D={best:0,bc:0,coins:0,acc:{},vol:.8,own:{},eq:{bg:'none',theme:'neon',fx:'flash',ttl:''}},G=null,ac,master,noise,cb;
try{Object.assign(D,JSON.parse(localStorage.getItem('drum-master')||'{}'))}catch(e){}
const lsave=()=>{try{localStorage.setItem('drum-master',JSON.stringify(D))}catch(e){}},save=()=>{lsave();pushProf()};
if(!D.v){const o=D.acc,m=[0,1,2,4,5,6,7,3,8,9];D.acc={};for(const k in o)D.acc[m[k]]=o[k];D.v=1;save()}
if(D.v<2){if(D.acc[9]!=null){D.acc[12]=D.acc[9];delete D.acc[9]}D.v=2;save()}
const P=(c,h,s,k)=>[c,h,s,k].map(x=>x||'.'.repeat(16));
const L=[
{n:'4분음표',g:'킥을 1·2·3·4박에 정확히 치기',bpm:70,ps:80,p:P('','','','x...x...x...x...')},
{n:'기본 드럼 비트',g:'킥은 1·3박, 스네어는 2·4박',bpm:70,ps:80,p:P('','','....x.......x...','x.......x.......')},
{n:'8분음표 하이햇',g:'한 박을 두 부분으로 나눠 치기',bpm:70,ps:80,p:P('','x.x.x.x.x.x.x.x.')},
{n:'동시 연주',g:'두 악기를 동시에 누르기',bpm:70,ps:80,p:P('','x...x...x...x...','....x.......x...','x.......x.......')},
{n:'기본 8비트',g:'하이햇 + 킥 + 스네어 조합',bpm:75,ps:80,p:P('','x.x.x.x.x.x.x.x.','....x.......x...','x.......x.......')},
{n:'쉼표',g:'연주하는 위치와 쉬는 위치 구분',bpm:75,ps:85,p:P('','x...x.x.x...x.x.','....x.......x...','x.......x.......')},
{n:'16분음표 하이햇',g:'한 박을 네 부분으로 나눠 치기',bpm:70,ps:85,p:P('','xxxxxxxxxxxxxxxx','....x.......x...','x.......x.......')},
{n:'싱코페이션',g:'박자 사이(엇박)의 킥 강조',bpm:75,ps:85,p:P('','x.x.x.x.x.x.x.x.','....x.......x...','x.....x...x.....')},
{n:'크래시 악센트',g:'1박에 킥 + 크래시 동시 연주',bpm:75,ps:85,p:P('x...............','..x.x.x.x.x.x.x.','....x.......x...','x.......x.......')},
{n:'스네어 엇박',g:'2·4박 스네어에 박자 사이 한 번 더하기',bpm:70,ps:80,p:P('','x.x.x.x.x.x.x.x.','....x.......x.x.','x.......x.......')},
{n:'하이햇 섞어 치기',g:'8분음표와 16분음표를 섞어 치기',bpm:70,ps:80,p:P('','x.x.xxx.x.x.xxx.','....x.......x...','x.......x.......')},
{n:'엇박 킥 + 크래시',g:'크래시 악센트에 엇박 킥 더하기',bpm:75,ps:80,p:P('x...............','..x.x.x.x.x.x.x.','....x.......x...','x.....x.x.......')},
{n:'종합 연주',g:'지금까지 배운 리듬을 하나로 결합',bpm:75,ps:80,p:P('x...............','x.x.xxx.x.x.xxx.','....x.......x.x.','x.....x.x.......')}];
const PO=[[0,1],[2,4],[5,8],[6],[7],[3,11,12]],ZN=['기본 박자','8분음표','쉼표와 악센트','16분음표','싱코페이션','복합 리듬'];
const J={P:['PERFECT','#ffe83d',1],G:['GREAT','#3df0ff',.9],O:['GOOD','#7dff7d',.7]};

/* 사운드 (Web Audio 합성) */
function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.connect(ac.destination);const b=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;noise=b}master.gain.value=D.vol;if(ac.state!=='running')ac.resume()}
function snd(i,t=ac.currentTime){const g=ac.createGain(),Z=SETS.base;g.connect(master);
if(i==='K'){const o=ac.createOscillator();o.frequency.setValueAtTime(Z.kf,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+Z.kd);o.connect(g);o.start(t);o.stop(t+Z.kd+.01);return}
const [fr,d]={S:[Z.sf,.18],H:[Z.hf,.05],C:[4000,Z.cd]}[i],n=ac.createBufferSource(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=fr;n.buffer=noise;g.gain.setValueAtTime(i==='C'?.5:.7,t);g.gain.exponentialRampToValueAtTime(.001,t+d);n.connect(f);f.connect(g);n.start(t);n.stop(t+d+.05);
if(i==='S'){const o=ac.createOscillator(),og=ac.createGain();o.type='triangle';o.frequency.value=Z.st;og.gain.setValueAtTime(.5,t);og.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(og);og.connect(master);o.start(t);o.stop(t+.11)}}
function click(t,a){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=a?1800:1200;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.connect(g);g.connect(cb||master);o.start(t);o.stop(t+.05)}
function demo(i){audio();const t=ac.currentTime+.1,sp=60/L[i].bpm/4;for(let b=0;b<2;b++)INST.forEach((s,k)=>{for(let j=0;j<16;j++)if(L[i].p[k][j]==='x')snd(s,t+(b*16+j)*sp)})}

/* 화면 */
function show(id){document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));if(id==='board')drawBoard();if(id==='shop')drawShop();if(id==='menu'){acct();$('coin').textContent=D.coins;$('best').textContent=D.best;$('bc').textContent=D.bc}}
function lessons(){show('lessons');$('llist').innerHTML=L.map((l,i)=>{const ok=i==0||D.acc[i-1]>=L[i-1].ps,a=D.acc[i],g=l.p.map((r,k)=>'CHSK'[k]+' '+r.replace(/x/g,'●').replace(/\./g,'·').replace(/(.{4})/g,'$1 ')).join('\n');
return `<div class="card"><b>${i+1}. ${l.n}</b> ${a>=l.ps?'✅':''}<div class="dim">${l.g} · ${l.bpm}BPM · 통과 ${l.ps}%${a?' · 최고 '+a+'%':''}</div><pre>  1    2    3    4\n${g}</pre>${ok?`<button class="sm" onclick="demo(${i})">예시 듣기</button><button class="sm" onclick="run('L',${i})">연주 시작</button>`:'<span class="dim">이전 스테이지를 통과하면 열립니다.</span>'}</div>`}).join('')}

/* 게임 */
function run(mode,li){audio();if(cb)cb.disconnect();cb=ac.createGain();cb.connect(master);show('game');sz();$('pause').classList.remove('on');
G={mode,li,notes:[],grid:[],chunks:[],ce:0,mp:0,score:0,combo:0,maxc:0,mist:0,cnt:{P:0,G:0,O:0,M:0},wrong:0,stage:0,accs:[],bpm:mode==='L'?L[li].bpm:70,over:0,paused:0,flash:{},fx:[],coins:0,t:0};
const be=60/G.bpm,t0=ac.currentTime+.4;for(let i=0;i<4;i++){click(t0+i*be,!i);G.grid.push({t:t0+i*be,l:i+1,d:1})}
G.t=t0+4*be;addChunk();upd();const id=++LID;requestAnimationFrame(()=>loop(id))}
function addChunk(){const s=G.stage++;let li,bars=2;
if(G.mode==='L'){li=G.li;bars=4}else{const a=G.accs.slice(-5),av=a.length?a.reduce((x,y)=>x+y)/a.length:.9;
if(a.length)G.bpm=Math.max(60,Math.min(130,G.bpm+(av>=.95?4:av<.7?-4:0)));
const pl=PO[Math.min(5,s/5|0)];li=av<.7&&G.last!=null?G.last:pl[Math.random()*pl.length|0];G.last=li;
$('goal').textContent=`구간 ${Math.min(5,s/5|0)+1}: ${ZN[Math.min(5,s/5|0)]} · ${G.bpm}BPM`}
if(G.mode==='L')$('goal').textContent=L[li].g;
const sp=60/G.bpm/4,c={a:G.notes.length,end:G.t+bars*16*sp};G.chunks.push(c);
for(let b=0;b<bars;b++)for(let j=0;j<16;j++){const t=G.t+(b*16+j)*sp;if(j%4==0)G.grid.push({t,l:String(j/4+1)});else if(j%4==2)G.grid.push({t,l:'&'});
INST.forEach((s2,k)=>{if(L[li].p[k][j]==='x')G.notes.push({t,i:s2,h:0})})}
for(let b=0;b<bars*4;b++)click(G.t+b*sp*4,b%4==0);c.e=G.notes.length;G.t=c.end}
function ev(c){let w=0,n=c.e-c.a;for(let k=c.a;k<c.e;k++)if(G.notes[k].h>0)w+=G.notes[k].w;const a=n?w/n:1;G.accs.push(a);if(G.mode==='I'&&a>=.7)G.coins+=10;upd();lbPut()}
const acc=()=>{const c=G.cnt,d=c.P+c.G+c.O+c.M+G.wrong;return d?(c.P+c.G*.9+c.O*.7)/d:1};
function upd(){$('sc').textContent=G.score;$('cb').textContent=G.combo;$('st').textContent=G.mode==='L'?G.li+1+'/'+L.length:G.accs.length+1;$('ac').textContent=Math.round(acc()*100)+'%';$('ms').textContent=G.mode==='I'?G.mist+'/15':'-'}
function pop(t,c){const e=$('judge');e.textContent=t;e.style.color=c;e.animate([{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:150})}
function bad(t){G.combo=0;G.mist++;pop(t,'#ff5577');upd();if(G.mode==='I'&&G.mist>=15&&!G.over)fin()}
function hit(ins){if(!G||G.over||G.paused||!$('game').classList.contains('on'))return;
snd(ins);const now=ac.currentTime;G.flash[ins]=now;if(now<G.notes[0].t-.3)return;let b=null;
for(let k=G.mp;k<G.notes.length;k++){const n=G.notes[k];if(n.t-now>.22)break;if(n.i===ins&&!n.h&&Math.abs(n.t-now)<=.22){b=n;break}}

forest:{bg:'#06120d',card:'#0f2c20cc',s:'#7dffb0',sg:'#7dffb044',bd:'#7dffb044',dim:'#8fbfa6',hf:'"Trebuchet MS","Noto Sans KR",sans-serif',deco:'radial-gradient(circle at 18% 22%,#d6ff8a 0 2px,#d6ff8a00 6px),radial-gradient(circle at 78% 14%,#d6ff8a 0 2px,#d6ff8a00 6px),radial-gradient(circle at 64% 46%,#d6ff8a 0 1.5px,#d6ff8a00 5px),radial-gradient(circle at 30% 68%,#d6ff8a 0 2px,#d6ff8a00 6px),radial-gradient(circle at 88% 80%,#d6ff8a 0 2px,#d6ff8a00 6px),radial-gradient(ellipse at 50% 100%,#1f7a50aa,#0000 60%),linear-gradient(#0b241a,#06120d)'}};
const ITEMS=[['bg','none','기본',0],['bg','stage','무대 조명',500],['bg','vinyl','LP 레코드',800],['bg','wave','이퀄라이저',1200],['theme','neon','네온 블루',0],['theme','sunset','선셋',600],['theme','forest','포레스트',600],['fx','flash','기본 반짝임',0],['fx','ring','링 이펙트',750],['fx','spark','스파크 이펙트',1200],['ttl','','칭호 없음',0],['ttl','tb','비트 수집가',300],['ttl','tj','리듬 장인',900],['ttl','tl','전설의 드러머',2400],['ttl','tm','🏆 DRUM MASTER',0],['ttl','tg','리듬의 신',0]];
/* 삭제된 드럼 세트 구매분은 원가로 환불 */
function mig(){let c=0;for(const[k,v]of[['electro',300],['deep',500]])if(D.own['set:'+k]){c+=v;delete D.own['set:'+k]}delete D.eq.set;if(!D.eq.bg)D.eq.bg='none';if(c){D.coins+=c;D.rf=c;save()}}
const TN=id=>(ITEMS.find(x=>x[0]==='ttl'&&x[1]===id)||[0,0,''])[2],owned=i=>i[3]===0?(i[1]==='tm'?D.bc>=100:i[1]==='tg'?perf():true):!!D.own[i[0]+':'+i[1]],perf=()=>L.every((l,k)=>D.acc[k]>=100);
/* 리듬의 신: 모든 레슨 100% 달성 시 획득 연출 */
function gtX(){$('gt').classList.remove('on')}
function gtEq(){D.eq.ttl='tg';setTtl();save();gtX();acct()}
function gtShow(){const e=$('gt');e.querySelectorAll('i').forEach(x=>x.remove());for(let k=0;k<28;k++){const i=document.createElement('i');i.style.cssText=`--a:${k*360/28+Math.random()*10}deg;--d:${120+Math.random()*130}px;animation-delay:${.35+Math.random()*.15}s`;e.appendChild(i)}e.classList.add('on')}
function applyTheme(){const t=TH[D.eq.theme]||TH.neon,r=document.documentElement.style;for(const k in t)r.setProperty('--'+k,t[k]);$('acct').className='card pbg-'+(D.eq.bg||'none')}
function setTtl(){if(ACC&&RB[ACC.key]&&DB)try{DB.doc('scores/'+ACC.key).update({ttl:TN(D.eq.ttl)}).catch(()=>{})}catch(e){}}
function drawShop(){$('sc2').textContent=D.coins;if(D.rf){$('shm').textContent='삭제된 드럼 세트 구매분 '+D.rf+' 🪙을 환불했어요.';delete D.rf;lsave()}$('sl').innerHTML=[['bg','프로필 배경'],['theme','배경 테마'],['fx','타격 시각 효과'],['ttl','칭호']].map(([c,h])=>`<h3>${h}</h3>`+ITEMS.filter(i=>i[0]===c).map(i=>{const d=`data-c='${c}' data-id='${i[1]}'`;const t=TH[i[1]],st=c==='theme'&&t?` style='background:${t.deco},${t.bg}'`:'';return `<div class='card row${c==='bg'?' pbg-'+i[1]:''}'${st}><span class='nm'>${i[2]}</span>${D.eq[c]===i[1]?`<span class='dim'>장착 중</span>`:owned(i)?`<button class='sm' data-a='eq' ${d}>장착</button>`:i[3]===0?`<span class='dim'>${i[1]==='tg'?'모든 레슨 100% 달성 시 해금':'100콤보 달성 시 해금'}</span>`:`<button class='sm' data-a='buy' ${d}>${i[3]} 🪙 구매</button>`}</div>`}).join('')).join('')}
$('sl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.c,id=b.dataset.id,a=b.dataset.a,it=ITEMS.find(x=>x[0]===c&&x[1]===id),m=$('shm');m.textContent='';
if(a==='buy'){if(D.coins<it[3]){m.textContent='코인이 부족해요.';return}D.coins-=it[3];D.own[c+':'+id]=1;m.textContent=it[2]+' 구매 완료! 바로 장착했어요.'}
D.eq[c]=id;if(c==='theme'||c==='bg')applyTheme();if(c==='ttl')setTtl();save();drawShop()};
mig();applyTheme();$('vol').value=D.vol;$('vol').oninput=e=>{D.vol=+e.target.value;if(master)master.gain.value=D.vol;lsave()};
show('menu');
</script></body></html>
